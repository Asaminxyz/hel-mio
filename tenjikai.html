<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>HELMIO 展示会プレゼン堂</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #ffffff;
    }

    body {
      overflow-x: hidden;
    }

    .page {
      display: flex;
      justify-content: center;
      width: 100%;
    }

    .page-image {
      display: block;
      width: min(100%, 1024px);
      height: auto;
      margin: 0;
      border: 0;
    }
  </style>
</head>

<body>
  <main class="page">
    <img
      class="page-image"
      src="helmio.png"
      width="1024"
      height="1536"
      alt="HELMIO 展示会プレゼン堂"
    />
  </main>
</body>
</html>
